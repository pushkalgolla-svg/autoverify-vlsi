name: RTL Verification Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rtl-verification:
    name: AutoVerify-VLSI Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System EDA Tools (Icarus Verilog)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y iverilog

      - name: Verify EDA Toolchain
        run: |
          iverilog -V
          vvp -V

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install .
          fi

      - name: Run Full RTL Regression Suite
        run: |
          python scripts/verify.py --regression --no-ai

      - name: Upload Regression Dashboard and Waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: |
            logs/regression_dashboard.md
            logs/regression_dashboard.html
            logs/*_sim.log
            logs/*.vcd
