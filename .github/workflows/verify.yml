name: RTL Verification Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rtl-verification:
    name: AutoVerify-VLSI Regression & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System EDA Tools (Icarus Verilog)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y iverilog

      - name: Verify EDA Toolchain
        run: |
          iverilog -V
          vvp -V

      - name: Run Full RTL Regression & Functional Coverage Suite (Offline / No-AI)
        run: |
          python scripts/verify.py --regression --no-ai

      - name: Run Isolated AI Self-Healing Workflow Demonstration (Offline)
        run: |
          python scripts/demo_ai_healing.py --offline

      - name: Upload Regression Dashboard, Coverage & Waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-and-coverage-artifacts
          path: |
            logs/regression_dashboard.md
            logs/regression_dashboard.html
            logs/coverage_report.md
            logs/toggle_report.md
            logs/*_sim.log
            logs/*.vcd
            examples/faulty_rtl/alu_healing_report.md
            examples/faulty_rtl/alu_healing_patch.diff
